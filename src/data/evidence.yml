# One dated observation per row. Rows are scrubbed from the owner's private record: no address, no operator or portal name, no search criterion.
# Dates are the precision the source holds. The source gives a month for most rows, so most rows carry a month, not a day.
# A row about a period carries the first day or month of it, and its text names the whole period.
# Rows E18 to E23 are fixes. The source dates the failures, not the fixes, so each fix row carries the month its version is first known to have run and says so in `recorded`.
