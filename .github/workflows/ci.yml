name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      # Everything the tests need is installed here, before the first test step (REQ-038).
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Install the link checker
        env:
          LYCHEE_URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          mkdir -p "$RUNNER_TEMP/lychee" "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" "$LYCHEE_URL"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee"
          install -m 755 "$(find "$RUNNER_TEMP/lychee" -type f -name lychee | head -n 1)" "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/lychee" --version
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build && npm run build:fixture
      - name: Contrast
        run: npm run contrast
      - name: Requirement traceability
        run: npm run trace
      - name: Numbers match the snapshot
        run: npm run numbers -- --from-snapshot --check
      - name: Browser tests with axe
        run: npm run e2e
      - name: Link check (offline)
        run: lychee --offline --no-progress --root-dir "$GITHUB_WORKSPACE/dist" './dist/**/*.html'
      - name: Transfer sizes (printed, not a gate)
        run: npm run sizes
      - name: Screenshots for the README (script exercised, output discarded)
        run: npm run screenshots -- "$RUNNER_TEMP/shots"

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-browser:
    # Firefox and WebKit run the same browser tests. Reported on the pull request; not a required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Install the browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Build
        run: npm run build && npm run build:fixture
      - name: Browser tests in Firefox and WebKit
        run: npx playwright test --project=firefox --project=webkit
        env:
          CROSS_BROWSER: "1"

  build-pages:
    # Builds the Pages artifact on every pull request and push, so the deploy path is exercised before merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Build
        run: npm run build
      - name: Scan the built files for third-party origins
        run: npx tsx scripts/scan-dist.ts dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    # Only from main, only after the checks of this workflow passed on the same commit (REQ-052).
    needs: [test, gitleaks, build-pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Check the legal text
        id: legal
        continue-on-error: true
        run: npx tsx scripts/legal-check.ts
      - name: Say why nothing was published
        if: steps.legal.outcome == 'failure'
        run: echo "::warning title=Not deployed::The legal text is pending (OWNER-DECISION-PENDING in src/content/legal). Nothing was published."
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.legal.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
